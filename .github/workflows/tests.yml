name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Independently reconstruct the intent study and verify evidence
        run: python research/verify_intent.py
      - name: Ensure private evidence is not tracked
        run: |
          test -z "$(git ls-files evidence)"
          test -f docs/index.html
          test -f docs/recovery.html
